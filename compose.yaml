services:
  api:
    build: .
    env_file:
      - .env
    environment:
      PITZ_API_KEY: ${PITZ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_PATH: /data/pitz-pulse.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pitz_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  pitz_data:
