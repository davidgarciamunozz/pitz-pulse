[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "pitz-pulse"
version = "0.1.0"
description = "Classification contracts for internal request triage."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.12.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
